name: Prisma migration checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/prisma-migration-checks.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm?schema=public
      CRM_SESSION_SECRET: test-only-secret-with-at-least-32-characters
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations to a clean PostgreSQL database
        run: npx prisma migrate deploy
      - name: Run ESLint on migrated server code
        run: npx eslint src/app/api src/lib src/proxy.ts prisma.config.ts
      - name: Run unit tests
        run: npm test
      - name: Build Next.js application
        run: npm run build
