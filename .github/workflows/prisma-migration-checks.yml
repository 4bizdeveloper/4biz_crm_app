name: Prisma migration checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/prisma-migration-checks.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm?schema=public
      CRM_SESSION_SECRET: test-only-secret-with-at-least-32-characters
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
      - name: Commit reconciled npm lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync npm lockfile for Prisma adapter'
          file_pattern: package-lock.json
      - name: Upload reconciled npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: prisma-migration-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run ESLint on migrated server code
        run: npx eslint src/app/api src/lib src/proxy.ts prisma.config.ts
      - name: Build Next.js application
        run: npm run build
